[project]
name = "mcp-safebase"
version = "0.3.0"
description = "Encrypted file-based storage MCP server with per-bucket passwords and human-only secret editing."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Milan", email = "lesichkovm@gmail.com" },
]
keywords = ["mcp", "encryption", "secrets", "password", "fernet", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "mcp>=2.0.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/lesichkovm/mcp-safebase"
Repository = "https://github.com/lesichkovm/mcp-safebase"
Issues = "https://github.com/lesichkovm/mcp-safebase/issues"

[project.scripts]
safebase-server = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# server.py is a top-level module (the facade); safebase/ is the package.
only-include = ["server.py", "safebase"]
