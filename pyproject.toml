[project]
name = "mcp-safebase"
version = "0.1.0"
description = "Encrypted file-based storage MCP server with per-bucket passwords and human-only secret editing."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.0.0",
]

[project.scripts]
safebase-server = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# server.py is a top-level module (the facade); safebase/ is the package.
only-include = ["server.py", "safebase"]
